version: '3.8'

services:
  neo4j:
    image: neo4j:5.12.0
    container_name: neo4j_movielens
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - ./data:/data
      - ./import:/var/lib/neo4j/import